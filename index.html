<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Верити цундере</title>

    <link rel="stylesheet" href="/static/style.css">

    <style>
        .thinking-toggle {
            display: block;
            margin-top: 7px;
            padding: 6px 11px;
            border: 0.5px solid rgba(255, 45, 85, 0.4);
            border-radius: 12px;
            background: rgba(255, 45, 85, 0.1);
            color: #ff2d55;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .thinking-toggle:active {
            opacity: 0.7;
        }

        .thinking-box {
            display: none;
            margin-top: 7px;
            padding: 10px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            color: #ddd;
            font-size: 13px;
            line-height: 1.4;
            white-space: pre-wrap;
            backdrop-filter: blur(10px);
        }

        .thinking-box.open {
            display: block;
        }

        .bot-response {
            max-width: 78%;
            align-self: flex-start;
        }

        .bot-response .message {
            max-width: 100%;
        }
    </style>
</head>
<body>

<div class="main-header">
    <div class="header-info">
        <h1 id="header-title">Верити цундере</h1>
        <div class="status">онлайн</div>
    </div>

    <div class="header-controls">
        <!-- Кнопка переключения матовости стекла -->
        <button id="matte-toggle-btn" class="matte-toggle-btn" type="button">Матово</button>

        <label class="input-switch" title="Показывать поле ввода">
            <input type="checkbox" id="input-toggle" checked onchange="toggleInput()">
            <span class="switch-slider"></span>
        </label>
    </div>
</div>

<div id="chat-window">
    <div class="message bot">
        Че надо, бездарь? Спрашивай свою глупость, я жду. И не думай, что мне интересно!
    </div>
</div>

<div id="input-panel">
    <div class="input-container">
        <input type="text" id="user-input" placeholder="Напиши что-нибудь..." autocomplete="off">
        <button id="send-btn" type="button">
            <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor;">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
            </svg>
        </button>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const inputPanel = document.getElementById('input-panel');
    const inputToggle = document.getElementById('input-toggle');
    const matteToggleBtn = document.getElementById('matte-toggle-btn');

    // Логика кнопки матовости (жидкое стекло <-> матовый режим)
    matteToggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('matte-mode');
        matteToggleBtn.textContent = document.body.classList.contains('matte-mode') ? 'Стекло' : 'Матово';
    });

    function toggleInput() {
        const hidden = !inputToggle.checked;
        inputPanel.classList.toggle('input-hidden', hidden);
        document.body.classList.toggle('input-off', hidden);
        scrollToBottom();
    }

        setTimeout(() => {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }, 50);
    }
