<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Верити цундере</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Верхняя шапка -->
    <header class="main-header">
        <div class="header-info">
            <h1>Верити цундере</h1>
            <span class="status">онлайн</span>
        </div>
        <div class="header-controls">
            <button class="matte-toggle-btn" onclick="toggleMatteMode()">Матово</button>
            <label class="input-switch">
                <input type="checkbox" id="mode-checkbox" onchange="toggleMatteMode()">
                <span class="switch-slider"></span>
            </label>
        </div>
    </header>

    <!-- Окно чата -->
    <div id="chat-window">
        <div class="message bot">
            Че надо, бездарь? Спрашивай свою глупость, я жду. И не думай, что мне интересно!
        </div>
    </div>

    <!-- Нижняя панель ввода (стеклянная с неоновой кнопкой) -->
    <div id="input-panel">
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Напиши что-нибудь..." autocomplete="off">
            <button id="send-btn" onclick="sendMessage()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

            document.body.classList.toggle('matte-mode');
            const checkbox = document.getElementById('mode-checkbox');
            checkbox.checked = document.body.classList.contains('matte-mode');
        }
