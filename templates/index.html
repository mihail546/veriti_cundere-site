<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Верити цундере</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Шапка -->
    <header class="main-header">
        <div class="header-info">
            <h1>Верити цундере</h1>
            <span class="status">онлайн</span>
        </div>
        <div class="header-controls">
            <button class="matte-toggle-btn" id="toggle-btn" onclick="toggleMatteMode()">✨ Стекло / Матово</button>
        </div>
    </header>

    <!-- Окно чата -->
    <div id="chat-window">
        <div class="message bot">
            Че надо, бездарь? Спрашивай свою глупость, я жду. И не думай, что мне интересно!
        </div>
    </div>

    <!-- Панель ввода -->
    <div id="input-panel">
        <div class="input-container">
            <input type="text" id="user-input" placeholder="Напиши что-нибудь..." autocomplete="off">
            <button id="send-btn" onclick="sendMessage()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script>
        function toggleMatteMode() {
            const isMatte = document.body.classList.toggle('matte-mode');
            const btn = document.getElementById('toggle-btn');
            btn.textContent = isMatte ? '🕋 Матово' : '✨ Стекло';
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const text = input.value.trim();
            if (!text) return;

            const chatWindow = document.getElementById('chat-window');

            // Блокируем ввод во время запроса
            input.disabled = true;
            sendBtn.disabled = true;

            // Вывод сообщения пользователя (используем textContent для защиты от XSS)
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chatWindow.appendChild(userMsg);

            input.value = '';
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // Индикатор мысли
            const statusMsg = document.createElement('div');
            statusMsg.className = 'message system-status';
            statusMsg.textContent = '🧠 Мысли Верити...';
            chatWindow.appendChild(statusMsg);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                // Проверяем, ответил ли сервер успешно (статус 2xx)
                if (!response.ok) {
                    throw new Error(`Ошибка сервера: ${response.status}`);
                }

                const data = await response.json();
                
                const botMsg = document.createElement('div');
                botMsg.className = 'message bot';
                botMsg.textContent = data.reply || 'Ой, ошибка какая-то... отстань!';
                chatWindow.appendChild(botMsg);

            } catch (e) {
                const botMsg = document.createElement('div');
                botMsg.className = 'message bot';
                botMsg.textContent = 'Сервер глючит... Это точно ты что-то сломал!';
                chatWindow.appendChild(botMsg);
            } finally {
                // Очищаем статус, возвращаем активность инпуту и возвращаем фокус
                statusMsg.remove();
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }
        }

        // Обработка нажатия Enter (с учетом особенностей мобильных клавиатур)
        document.getElementById('user-input').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.isComposing) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
